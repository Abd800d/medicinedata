name: Android APK

# Builds a real, installable APK from this repository — no Android Studio needed.
#   Actions → Android APK → Run workflow
# The APK is attached to the run as the artifact "mda-apk".
#
# Required repository variable (Settings → Secrets and variables → Actions → Variables):
#   VITE_API_BASE = https://your-mda-host.example.com     ← the app talks to this server
# Optional secrets for a signed release build:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: 'Backend URL (overrides the VITE_API_BASE variable)'
        required: false
        default: ''
      build_type:
        description: 'debug (installable anywhere) or release (needs keystore secrets)'
        required: true
        default: 'debug'
        type: choice
        options: [debug, release]
  push:
    tags:
      - 'v*'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_BASE: ${{ github.event.inputs.api_base || vars.VITE_API_BASE }}
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        # --ignore-scripts skips better-sqlite3's native build; the APK only needs the web bundle.
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Fail early if the backend URL is missing
        run: |
          if [ -z "$API_BASE" ]; then
            echo "::error::Set the repository variable VITE_API_BASE (Settings → Secrets and variables → Actions → Variables) to your deployed server URL, or pass api_base when running the workflow."
            exit 1
          fi
          echo "Backend: $API_BASE"

      - name: Build web bundle
        env:
          VITE_API_BASE: ${{ env.API_BASE }}
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Restore release keystore
        if: env.BUILD_TYPE == 'release' && env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mda-release.keystore"
          echo "MDA_KEYSTORE_PATH=$RUNNER_TEMP/mda-release.keystore" >> "$GITHUB_ENV"
          echo "MDA_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "MDA_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "MDA_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          VERSION_NAME="${GITHUB_REF_NAME:-1.0.0}"
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease --no-daemon -PversionName="$VERSION_NAME" -PversionCode="${{ github.run_number }}"
          else
            ./gradlew assembleDebug --no-daemon -PversionName="$VERSION_NAME" -PversionCode="${{ github.run_number }}"
          fi

      - name: Collect artifact
        run: |
          mkdir -p out
          find android/app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -lh out/
          echo "APK count: $(ls out/*.apk 2>/dev/null | wc -l)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mda-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "### MDA APK"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Backend | \`$API_BASE\` |"
            echo "| Type | $BUILD_TYPE |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo ""
            echo "Download the artifact **mda-apk** above, then install it on the phone (allow installing from this source)."
          } >> "$GITHUB_STEP_SUMMARY"
