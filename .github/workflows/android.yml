name: Android APK

# Builds a real, installable APK from this repository — no Android Studio needed.
#   Actions → Android APK → Run workflow     (needs this file on the default branch)
#   or push a tag:  git tag v1.0.1 && git push origin v1.0.1
# The APK is uploaded as the artifact "mda-apk" and, for tags, attached to a Release.
#
# Optional repository variable: VITE_API_BASE = https://your-mda-host.example.com
# (the URL can also be changed inside the installed app: More → الخادم والاتصال)
# Optional secrets for a signed release build:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: 'Backend URL (overrides the VITE_API_BASE variable)'
        required: false
        default: ''
      build_type:
        description: 'debug (installable anywhere) or release (needs keystore secrets)'
        required: true
        default: 'debug'
        type: choice
        options: [debug, release]
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Fallback keeps tag pushes working even when the repository variable is unset;
      # the URL can always be changed later inside the app (More → الخادم والاتصال).
      API_BASE: ${{ github.event.inputs.api_base || vars.VITE_API_BASE || 'https://4000-if57og1dz3iqxc4tdq20a.e2b.app' }}
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        # --ignore-scripts skips better-sqlite3's native build; the APK only needs the web bundle.
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Fail early if the backend URL is missing
        run: |
          if [ -z "$API_BASE" ]; then
            echo "::error::Set the repository variable VITE_API_BASE (Settings → Secrets and variables → Actions → Variables), pass api_base when running the workflow, or edit the fallback in this file."
            exit 1
          fi
          echo "Backend: $API_BASE"

      - name: Build web bundle
        env:
          VITE_API_BASE: ${{ env.API_BASE }}
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate the preinstalled Android SDK
        run: |
          set -e
          for candidate in "${ANDROID_SDK_ROOT:-}" "${ANDROID_HOME:-}" /usr/local/lib/android/sdk "$HOME/android-sdk"; do
            if [ -n "$candidate" ] && [ -d "$candidate" ]; then SDK="$candidate"; break; fi
          done
          if [ -z "${SDK:-}" ]; then
            echo "::warning::No preinstalled SDK found — downloading command-line tools"
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          TOOLS="$SDK/cmdline-tools/latest/bin"
          [ -d "$TOOLS" ] || TOOLS="$SDK/cmdline-tools/bin"
          echo "$TOOLS" >> "$GITHUB_PATH"
          echo "SDK root: $SDK"
          ls -1 "$SDK" | head -20

      - name: Install platform packages
        run: |
          sdkmanager --version || true
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Restore release keystore
        if: env.BUILD_TYPE == 'release' && env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mda-release.keystore"
          {
            echo "MDA_KEYSTORE_PATH=$RUNNER_TEMP/mda-release.keystore"
            echo "MDA_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "MDA_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "MDA_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          # branch names contain '/', so flatten to a Play-safe versionName
          VERSION_NAME="$(printf '%s' "${GITHUB_REF_NAME:-1.0.0}" | tr -c '[:alnum:]._-' '-' | cut -c1-32)"
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace -PversionName="$VERSION_NAME" -PversionCode="${{ github.run_number }}"
          else
            ./gradlew assembleDebug --no-daemon --stacktrace -PversionName="$VERSION_NAME" -PversionCode="${{ github.run_number }}"
          fi

      - name: Collect artifact
        run: |
          mkdir -p out
          find android/app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -lh out/
          echo "APK count: $(ls out/*.apk 2>/dev/null | wc -l)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mda-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' \
            "MDA $GITHUB_REF_NAME — APK" \
            "" \
            "- Default backend: $API_BASE" \
            "- Change inside the app: More → Server & connection (الخادم والاتصال)" \
            "- Install: allow install from this source, then open the APK." \
            > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" out/*.apk --title "MDA $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" \
            || gh release upload "$GITHUB_REF_NAME" out/*.apk --clobber

      - name: Summary
        run: |
          {
            echo "### MDA APK"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Backend | \`$API_BASE\` |"
            echo "| Type | $BUILD_TYPE |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo ""
            echo "Download the artifact **mda-apk** above, then install it on the phone (allow installing from this source)."
          } >> "$GITHUB_STEP_SUMMARY"
