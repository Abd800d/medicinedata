name: Android APK

# Builds a real, installable APK from this repository — no Android Studio needed.
#   Actions → Android APK → Run workflow     (needs this file on the default branch)
#   or push a tag:  git tag v1.0.1 && git push origin v1.0.1
# The APK is uploaded as the artifact "mda-apk" and, for tags, attached to a Release.
#
# Optional repository variable: VITE_API_BASE = https://your-mda-host.example.com
# (the URL can also be changed inside the installed app: More → الخادم والاتصال)
# Signed release builds (see docs/SIGNING.md):
#   secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   push a tag  ->  automatic signed release (.apk + .aab) attached to the GitHub Release
#   optional variable MDA_KEYSTORE_TYPE (default PKCS12; use JKS for keytool keystores)

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: 'Backend URL (overrides the VITE_API_BASE variable)'
        required: false
        default: ''
      build_type:
        description: 'auto (signed release on tags when the keystore secret exists, else debug) / debug / release'
        required: true
        default: 'auto'
        type: choice
        options: [auto, debug, release]
      build_format:
        description: 'apk (direct install) / aab (Google Play) / both'
        required: true
        default: 'both'
        type: choice
        options: [both, apk, aab]
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  issues: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Fallback keeps tag pushes working even when the repository variable is unset;
      # the URL can always be changed later inside the app (More → الخادم والاتصال).
      API_BASE: ${{ github.event.inputs.api_base || vars.VITE_API_BASE || 'https://4000-if57og1dz3iqxc4tdq20a.e2b.app' }}
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'auto' }}
      BUILD_FORMAT: ${{ github.event.inputs.build_format || 'both' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build settings
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          BT="$BUILD_TYPE"
          if [ -z "$BT" ] || [ "$BT" = "auto" ]; then
            if [ -n "$KEYSTORE_B64" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then BT=release; else BT=debug; fi
          fi
          if [ "$BT" = "release" ] && [ -z "$KEYSTORE_B64" ]; then
            echo "::error::build_type=release needs the ANDROID_KEYSTORE_BASE64 secret — see docs/SIGNING.md"
            exit 1
          fi
          if [ "$BT" != "release" ] && [ "$BUILD_FORMAT" != "apk" ]; then
            # A debug bundle is useless: fall back to an APK instead of failing the whole run.
            echo "::warning::debug build — producing app-debug.apk only (add ANDROID_KEYSTORE_BASE64 for a signed release/AAB)"
            echo "BUILD_FORMAT=apk" >> "$GITHUB_ENV"
            BUILD_FORMAT=apk
          fi
          echo "BUILD_TYPE=$BT" >> "$GITHUB_ENV"
          echo "build_type=$BT (format: $BUILD_FORMAT)"

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        # --ignore-scripts skips better-sqlite3's native build; the APK only needs the web bundle.
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Fail early if the backend URL is missing
        run: |
          if [ -z "$API_BASE" ]; then
            echo "::error::Set the repository variable VITE_API_BASE (Settings → Secrets and variables → Actions → Variables), pass api_base when running the workflow, or edit the fallback in this file."
            exit 1
          fi
          echo "Backend: $API_BASE"

      - name: Build web bundle
        env:
          VITE_API_BASE: ${{ env.API_BASE }}
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate the preinstalled Android SDK
        run: |
          set -e
          for candidate in "${ANDROID_SDK_ROOT:-}" "${ANDROID_HOME:-}" /usr/local/lib/android/sdk "$HOME/android-sdk"; do
            if [ -n "$candidate" ] && [ -d "$candidate" ]; then SDK="$candidate"; break; fi
          done
          if [ -z "${SDK:-}" ]; then
            echo "::warning::No preinstalled SDK found — downloading command-line tools"
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          TOOLS="$SDK/cmdline-tools/latest/bin"
          [ -d "$TOOLS" ] || TOOLS="$SDK/cmdline-tools/bin"
          echo "$TOOLS" >> "$GITHUB_PATH"
          echo "SDK root: $SDK"
          ls -1 "$SDK" | head -20

      - name: Install platform packages
        run: |
          sdkmanager --version || true
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Restore release keystore
        if: env.BUILD_TYPE == 'release'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_TYPE: ${{ vars.MDA_KEYSTORE_TYPE }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mda-release.keystore"
          SIZE=$(wc -c < "$RUNNER_TEMP/mda-release.keystore")
          echo "keystore restored: $SIZE bytes"
          test "$SIZE" -gt 1000 || { echo "::error::ANDROID_KEYSTORE_BASE64 could not be decoded into a keystore"; exit 1; }
          {
            echo "MDA_KEYSTORE_PATH=$RUNNER_TEMP/mda-release.keystore"
            echo "MDA_KEYSTORE_TYPE=${KS_TYPE:-PKCS12}"
            echo "MDA_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "MDA_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "MDA_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          VERSION_NAME="$(printf '%s' "${GITHUB_REF_NAME:-1.0.0}" | tr -c '[:alnum:]._-' '-' | cut -c1-32)"
          VERSION_CODE="${GITHUB_RUN_NUMBER:-1}"
          echo "versionName=$VERSION_NAME versionCode=$VERSION_CODE"
          TASK="assembleDebug"
          if [ "$BUILD_TYPE" = "release" ]; then
            case "$BUILD_FORMAT" in
              aab)  TASK="bundleRelease" ;;
              both) TASK="assembleRelease bundleRelease" ;;
              *)    TASK="assembleRelease" ;;
            esac
          fi
          set +e
          # shellcheck disable=SC2086  # unquoted on purpose: "a b" must expand to two Gradle tasks
          ./gradlew $TASK --no-daemon -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE" > build.log 2>&1
          STATUS=$?
          set -e
          echo "----- gradle tail -----"
          tail -80 build.log || true
          echo "----- end -----"
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::Gradle $TASK failed (exit $STATUS)"
            grep -nE "FAILURE|What went wrong|error:|Caused by:|Could not|Unsupported|SDK location|requires Java|Execution failed|> Task .* FAILED" build.log               | head -15 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$STATUS"

      - name: Publish gradle failure log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="$RUNNER_TEMP/body.md"
          {
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo ""
            echo '```'
            tail -150 android/build.log 2>/dev/null || echo "no build.log"
            echo '```'
          } > "$BODY"
          NUM=$(gh issue list --search 'in:title "APK build log"' --state open --json number --jq '.[0].number // empty' || true)
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body-file "$BODY"
          else
            gh issue create --title "APK build log" --body-file "$BODY"
          fi

      - name: Collect artifact
        run: |
          mkdir -p out
          find android/app/build/outputs/apk -name '*.apk' -exec cp {} out/ \; 2>/dev/null || true
          find android/app/build/outputs/bundle -name '*.aab' -exec cp {} out/ \; 2>/dev/null || true
          ls -lh out/
          echo "files: $(ls out/ | wc -l)"
      - name: Verify signature
        if: env.BUILD_TYPE == 'release'
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -x "$APKSIGNER" || APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          : > signature.txt
          for f in out/*.apk; do
            [ -f "$f" ] || continue
            echo "----- $f -----"
            set +e
            "$APKSIGNER" verify --verbose --print-certs "$f" >> signature.txt 2>&1
            RC=$?
            set -e
            tail -60 signature.txt
            {
              echo "### Signature — $f"
              echo ""
              echo '```'
              head -60 signature.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$RC" -ne 0 ]; then
              echo "::error::$f is not properly signed (apksigner exit $RC)"
              exit 1
            fi
            grep -q "MDA" signature.txt && echo "::notice::Signed by the MDA certificate"
          done

          JARSIGNER="$JAVA_HOME/bin/jarsigner"
          for f in out/*.aab; do
            [ -f "$f" ] || continue
            echo "----- $f (AAB) -----"
            set +e
            "$JARSIGNER" -verify -verbose -certs "$f" > aab.txt 2>&1
            RC=$?
            set -e
            grep -E "jar verified|Signer|CN=" aab.txt | head -8
            { echo "### Signature — $f"; echo ""; echo '```'; grep -E "jar verified|CN=" aab.txt | head -10; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            [ "$RC" -eq 0 ] || { echo "::error::$f AAB signature check failed"; exit 1; }
            { echo "----- $f (AAB) -----"; grep -E "jar verified|X\.509|Signature algorithm" aab.txt | head -20; } >> signature.txt
          done

      - name: Report signing certificate
        if: always() && env.BUILD_TYPE == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s signature.txt ] || { echo "no signature report"; exit 0; }
          BODY="$RUNNER_TEMP/sig.md"
          {
            echo "🔐 **Signing report** — run $GITHUB_RUN_ID ($BUILD_TYPE/$BUILD_FORMAT)"
            echo ""
            echo '```'
            head -40 signature.txt
            echo '```'
          } > "$BODY"
          NUM=$(gh issue list --search 'in:title "APK signing report"' --state open --json number --jq '.[0].number // empty' || true)
          if [ -n "$NUM" ]; then gh issue comment "$NUM" --body-file "$BODY"
          else gh issue create --title "APK signing report" --body-file "$BODY"; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mda-apk
          path: |
            out/*.apk
            out/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            printf '%s\n' \
              "## MDA $GITHUB_REF_NAME" \
              "" \
              "- Backend: \`$API_BASE\`" \
              "- Change it inside the app: More → الخادم والاتصال" \
              "- Build: $BUILD_TYPE / $BUILD_FORMAT" \
              ""
            if [ "$BUILD_TYPE" = "release" ]; then
              printf '%s\n' \
                "### ✅ نسخة موقّعة رسميًا (release-signed)" \
                "" \
                "- ثبّت \`app-release.apk\` للتوزيع المباشر." \
                "- \`app-release.aab\` للرفع على Google Play (Play Console → Production → Create release)." \
                "- ⚠️ إن كنت ثبّت نسخة debug سابقة (v1.0.x) احذفها أولًا: بصمة التوقيع مختلفة." \
                "- بصمة الشهادة: \`$(grep -m1 'certificate SHA-256 digest' signature.txt 2>/dev/null | sed 's/.*digest: //' || echo 'see build log')\`" \
                "" \
                "### 🔐 التحميل" \
                "" \
                "- من الهاتف: افتح هذا الإصدار ← Assets ← \`app-release.apk\` ← اسمح بالتثبيت من هذا المصدر."
            else
              printf '%s\n' \
                "### نسخة debug (للتجربة)" \
                "" \
                "- موقّعة بمفتاح debug — تُثبّت على أي جهاز، غير صالحة لمتجر Play." \
                "- لبناء نسخة رسمية: أضف أسرار التوقيع ثم أعد تشغيل البناء (docs/SIGNING.md)." \
                "" \
                "### 🔐 التحميل" \
                "" \
                "- من الهاتف: Assets ← \`app-debug.apk\` ← اسمح بالتثبيت من هذا المصدر."
            fi
          } > "$RUNNER_TEMP/notes.md"
          FILES=$(find out -maxdepth 1 -type f \( -name '*.apk' -o -name '*.aab' \) | sort | tr '\n' ' ')
          echo "attaching: $FILES"
          gh release create "$GITHUB_REF_NAME" $FILES --title "MDA $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" \
            || gh release upload "$GITHUB_REF_NAME" $FILES --clobber

      - name: Summary
        run: |
          {
            echo "### MDA APK"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Backend | \`$API_BASE\` |"
            echo "| Type | $BUILD_TYPE / $BUILD_FORMAT |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo ""
            echo "Download the artifact **mda-apk** above, then install it on the phone (allow installing from this source)."
          } >> "$GITHUB_STEP_SUMMARY"
