apply plugin: 'com.android.application'

/*
 * Signing (v1.8.4).
 *
 * CI runners are ephemeral: the default debug keystore is regenerated on every build, so
 * each APK had a *different* signature and installing a new version over the old one failed
 * with "App not installed". To make updates install over the previous release, a stable
 * distribution keystore ships with the repository and is used when the owner has not
 * configured the Google Play upload key (ANDROID_KEYSTORE_BASE64 secret).
 *
 *   ANDROID_KEYSTORE_BASE64 secret  → Play upload key (overrides everything)
 *   android/mda-distribution.keystore → direct-install key committed to this repository
 *
 * The distribution key is NOT a Play upload key: it only proves "the same publisher" for
 * sideloaded APKs. See docs/SIGNING.md.
 */
def externalKeystore = System.getenv("MDA_KEYSTORE_PATH")
def bundledKeystore = rootProject.file("mda-distribution.keystore")
def signingKeystore = externalKeystore ?: (bundledKeystore.exists() ? bundledKeystore.absolutePath : null)
def useBundledCreds = signingKeystore != null && !externalKeystore
logger.lifecycle("MDA signing: " + (signingKeystore ? (useBundledCreds ? "bundled distribution key" : "keystore from environment") : "none (unsigned release)"))

android {
    namespace "com.mda.medicinedata"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.mda.medicinedata"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI always passes -PversionCode=<run number>: it must only ever grow, otherwise Android
        // refuses the update over an installed release ("app not installed").
        // The fallback only applies to a manual build: keep it at or above the last published code.
        def ciVersionCode = project.findProperty("versionCode")?.toString()?.trim()
        def ciVersionName = project.findProperty("versionName")?.toString()?.trim()
        versionCode(ciVersionCode ? ciVersionCode.toInteger() : 51)
        versionName(ciVersionName ?: "1.10.2")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (signingKeystore) {
                storeFile file(signingKeystore)
                // PKCS#12 is the default (portable, generated by OpenSSL); override with
                // MDA_KEYSTORE_TYPE=JKS when using a classic keytool keystore.
                storeType System.getenv("MDA_KEYSTORE_TYPE") ?: "PKCS12"
                storePassword System.getenv("MDA_KEYSTORE_PASSWORD") ?: (useBundledCreds ? "mda-distribute-2026" : null)
                keyAlias System.getenv("MDA_KEY_ALIAS") ?: (useBundledCreds ? "mda" : null)
                keyPassword System.getenv("MDA_KEY_PASSWORD") ?: (useBundledCreds ? "mda-distribute-2026" : null)
            }
        }
    }
    buildTypes {
        release {
            if (signingKeystore) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
